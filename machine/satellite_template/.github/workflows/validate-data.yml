name: validate-data

# GITHUB_TOKEN only: no personal access tokens, no bot account, no writes.
on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: validate-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # Generous for a new catalog; measure a real run before trimming.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate {{title}}
        run: python -m app.validate
      - name: Tests
        run: |
          pip install pytest
          python -m pytest -q
